[pytest]
# Configuração pytest para mvpdepsicologia

# Define o caminho Python para imports absolutos
pythonpath = src

# Padrões de descoberta de testes
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de execução
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# Markers personalizados
markers =
    unit: marca testes unitários
    integration: marca testes de integração
    slow: marca testes lentos
    asyncio: marca testes assíncronos

# Logging
log_cli = false
log_cli_level = INFO
