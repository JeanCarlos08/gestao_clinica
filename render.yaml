services:
  - type: web
    name: gestao-clinica-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PYTHONPATH
        value: /app/src
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_DOCS_TEMPLATE_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: CREDENTIALS_SOURCE
        value: env
      - key: APP_ADMIN_USER
        sync: false
      - key: APP_ADMIN_PASS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_NAME
        value: "Clinica IA"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DPO_EMAIL
        sync: false
      - key: DPO_NOME
        sync: false
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOGIN_BLOCK_MINUTES
        value: "15"
    healthCheckPath: /api/health
    autoDeploy: true
