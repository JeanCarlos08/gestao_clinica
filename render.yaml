services:
  - type: web
    name: gestao-clinica-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PYTHONPATH
        value: /app/src
      # ── Banco de dados (Neon PostgreSQL) ────────────────────
      # Use DATABASE_URL completa — é mais simples e confiável
      - key: DATABASE_URL
        sync: false          # preencher no painel: postgresql://neondb_owner:SENHA@HOST/neondb?sslmode=require
      # ── Segurança JWT ───────────────────────────────────────
      - key: JWT_SECRET_KEY
        generateValue: true  # Render gera automaticamente
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"
      # ── Auth fallback ────────────────────────────────────────
      - key: APP_ADMIN_USER
        sync: false
      - key: APP_ADMIN_PASS
        sync: false
      # ── CORS ────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        sync: false          # ex: https://seu-frontend.vercel.app,http://localhost:3000
      # ── App ─────────────────────────────────────────────────
      - key: APP_NAME
        value: "Clinica IA"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # ── LGPD ─────────────────────────────────────────────────
      - key: DPO_EMAIL
        sync: false
      - key: DPO_NOME
        sync: false
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOGIN_BLOCK_MINUTES
        value: "15"
    healthCheckPath: /api/health
    autoDeploy: true
